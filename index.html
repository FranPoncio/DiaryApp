    <!-- El tema guardado se aplica acá, antes de que cargue React: si no, la app
         arranca un instante en la paleta de fábrica y parpadea. -->
    <script>try{var d=document.documentElement,t=localStorage.getItem("dbd:tema"),f=localStorage.getItem("dbd:fuente");if(t)d.dataset.tema=t;if(f)d.dataset.fuente=f}catch(e){}</script>
